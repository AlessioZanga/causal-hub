# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-lts-latest
  apt_packages:
    - libopenblas-dev
    - libssl-dev
    - pkg-config
  tools:
    python: "3.14"
    rust: latest
  jobs:
    # Link against the system OpenBLAS instead of compiling it from source
    pre_install:
      - sed -i 's|"backend/openblas-static"|"backend/openblas-system"|' python/Cargo.toml
    pre_build:
      - echo "Building causal-hub with maturin"
      - uv run --no-sync maturin develop --release

python:
  install:
    - method: uv
      command: sync

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: python/docs/source/conf.py
