[package]
name = "causal-hub"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
approx.workspace = true
csv.workspace = true
dry.workspace = true
fxhash.workspace = true
indexmap.workspace = true
jsonschema = { version = "^0.49", default-features = false }
itertools.workspace = true
log.workspace = true
ndarray = { version = "^0.17", features = ["approx", "rayon", "serde"] }
ndarray-linalg = { version = "^0.18", default-features = false }
ndarray-stats = "^0.7"
noisy_float = "^0.2"
paste.workspace = true
pest = "^2.8"
pest_derive = "^2.8"
rand.workspace = true
rand_distr.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json = "^1.0"
statrs = { version = "^0.19", default-features = false }
thiserror = "^2.0"

# Optional BLAS support for ndarray.
blas-src = { version = "^0.14", optional = true }
accelerate-src = { version = "^0.3", optional = true }
[target.'cfg(not(target_os = "windows"))'.dependencies]
openblas-src = { version = "^0.10.15", optional = true }
[target.'cfg(target_os = "windows")'.dependencies]
openblas-src = { version = "^0.10.15", optional = true, features = ["system"] }

[dev-dependencies]
rand_xoshiro.workspace = true
criterion = { version = "^0.8", features = ["html_reports"] }
tempfile = "^3.27"

[[bench]]
name = "benchmark"
harness = false

[features]
default = ["openblas-static"]
accelerate-system = [
    "ndarray/blas",
    "blas-src/accelerate",
]
openblas-static = [
    "ndarray/blas",
    "ndarray-linalg/openblas-static",
    "blas-src/openblas",
    "openblas-src/cache",
    "openblas-src/static",
]
openblas-system = [
    "ndarray/blas",
    "ndarray-linalg/openblas-system",
    "blas-src/openblas",
    "openblas-src/system",
]
