name: python-test

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x64
          - runner: ubuntu-24.04-arm
            target: aarch64
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.local/share/openblas_build
            ~/.cargo/registry
            ~/.cargo/git
            .venv
            target
          key: ${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ hashFiles('Cargo.lock') }}
            ${{ matrix.platform.runner }}-${{ matrix.platform.target }}-
            ${{ matrix.platform.runner }}-
      - name: Set up system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Set up uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca  # v9.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build
        run: |
          uv run \
            maturin develop \
            --release \
            --no-default-features \
            --features=pyo3/extension-module,pyo3/abi3-py312,backend/openblas-static
        env:
          OPENBLAS_TARGET: GENERIC
          DYNAMIC_ARCH: 1
      - name: Test
        run: |
          uv run pytest

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: pwsh -Command "& '{0}'"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            C:\vcpkg
            ~\.cargo\registry
            ~\.cargo\git
            .venv
            target
          key: ${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ hashFiles('Cargo.lock') }}
            ${{ matrix.platform.runner }}-${{ matrix.platform.target }}-
            ${{ matrix.platform.runner }}-
      - name: Set env variables
        run: |
          "RUSTFLAGS=-C target-feature=+crt-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SCCACHE_GHA_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=${{ matrix.platform.target }}-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_TRIPLET=${{ matrix.platform.target }}-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build OpenBLAS
        run: |
          vcpkg integrate install
          vcpkg install vcpkg-gfortran:${{ matrix.platform.target }}-windows
          $gfortran = Get-ChildItem -Path "C:\vcpkg\installed" -Filter "gfortran.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($gfortran) {
            $env:FC = $gfortran.FullName
            Write-Host "FC=$($gfortran.FullName)"
          } else {
            Write-Host "Warning: gfortran.exe not found in vcpkg installed directory"
          }
          vcpkg install openblas --overlay-ports=.vcpkg/ports
      - name: Set up uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca  # v9.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build
        run: |
          uv run `
            maturin develop `
            --release `
            --no-default-features `
            --features=pyo3/extension-module,pyo3/abi3-py312,backend/openblas-system
      - name: Test
        run: |
          uv run pytest

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-latest
            target: aarch64
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/Library/Application Support/openblas_build
            ~/.cargo/registry
            ~/.cargo/git
            .venv
            target
          key: ${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ hashFiles('Cargo.lock') }}
            ${{ matrix.platform.runner }}-${{ matrix.platform.target }}-
            ${{ matrix.platform.runner }}-
      - name: Set up uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca  # v9.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build
        run: |
          uv run \
            maturin develop \
            --release \
            --no-default-features \
            --features=pyo3/extension-module,pyo3/abi3-py312,backend/accelerate-system
      - name: Test
        run: |
          uv run pytest
